name: Repo metadata

# Sets the repository's topics, description and website link. These are GitHub
# settings rather than files, so a commit cannot carry them; the workflow token is
# the only credential this repository holds.
#
# Each step reports its HTTP result to the job summary, so a refusal is visible
# without access to private logs.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repo-meta.yml"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Check token permissions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Token permissions"
            echo '```'
            gh api "repos/$REPO" --jq '{permissions: .permissions, homepage: .homepage, description: .description}' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set topics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          out=$(gh api -X PUT "repos/$REPO/topics" \
            -f names[]=homeopathy -f names[]=homeopathic -f names[]=repertory \
            -f names[]=materia-medica -f names[]=offline-first -f names[]=expo \
            -f names[]=react-native -f names[]=typescript -f names[]=clinical-tools \
            -f names[]=sqlite -f names[]=sql-js -f names[]=wasm -f names[]=tauri \
            -f names[]=desktop-app -f names[]=github-pages -f names[]=local-first \
            -f names[]=privacy-first -f names[]=case-management -f names[]=no-backend 2>&1)
          code=$?
          {
            echo "### Topics (exit $code)"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Set description and homepage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          out=$(gh api -X PATCH "repos/$REPO" \
            -f homepage="https://drsamonline.github.io/UniRep/" \
            -f description="Offline universal index over the classical homeopathic repertories — Expo app, desktop shell, searchable web demo." 2>&1)
          code=$?
          {
            echo "### About (exit $code)"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
