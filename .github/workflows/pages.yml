name: Pages

# Publishes two things to GitHub Pages:
#   /       the landing page from docs/
#   /app/   the Expo web export of the app (the live demo)
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: app
        run: pnpm run typecheck

      # The web export searches the real core, so the database is built here. It
      # is GPL-licensed and therefore never committed; see unirep_data/DATA-LICENSES.md.
      - name: Build the repertory database
        run: |
          git clone --depth 1 \
            https://github.com/drsamonline/homoeopathic-materia-medica-repertory-json \
            "$HOME/rep-src"
          python3 scripts/build_core_db.py \
            --source-dir "$HOME/rep-src" \
            --books repertorium-publicum-2008 \
            --out app/assets/unirep_core.db

      - name: Export web build
        working-directory: app
        run: pnpm run export:web

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/app
          cp -r app/dist/. _site/app/
          # SPA routes resolve to the exported index
          cp _site/app/index.html _site/app/404.html
          # GitHub Pages must not run Jekyll over the exported bundle
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
