name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC — catches links that rot remotely
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fast, offline, no dependencies: verifies every relative link and asset
      # reference resolves to a file that exists in this repository.
      - name: Check local links and assets
        run: python3 scripts/check-links.py

  remote:
    name: Remote links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Network half of the check. Configuration lives in .lychee.toml.
      - name: Check remote links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --verbose .
          fail: true
