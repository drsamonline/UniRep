name: Desktop

# Builds the installable desktop app: a Windows .exe installer (NSIS) and a
# Linux .AppImage plus .deb. The shell is Tauri v2 around the same exported web
# build the browser demo uses, with the repertory database packaged inside, so
# the installed app runs without a network connection.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
            python: python3
          - os: windows-latest
            bundles: nsis
            python: python

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            build-essential curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build the repertory database
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/drsamonline/homoeopathic-materia-medica-repertory-json \
            "$HOME/rep-src"
          ${{ matrix.python }} scripts/build_core_db.py \
            --source-dir "$HOME/rep-src" \
            --books repertorium-publicum-2008 \
            --out app/assets/unirep_core.db

      - name: Export the web build
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm run export:web

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: unirep-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
