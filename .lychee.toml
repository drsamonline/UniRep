# lychee configuration — remote link check used by .github/workflows/links.yml
# Local (relative) links are checked by scripts/check-links.py instead.

max_retries = 2
retry_wait_time = 5
timeout = 20
# 403/405/429: hosts that block or rate-limit bare link checkers (Amazon answers
# 405 to HEAD, GitHub-hosted shops 403). The pages themselves exist.
accept = ["200..=299", "403", "405", "429"]

# The landing page opens the deployed app, a path only the Pages workflow
# creates. It is excluded here so the link check does not race the deployment;
# scripts/check-links.py verifies the source of that path, and the deploy itself
# fails loudly if the export is missing.
exclude = ["https://drsamonline.github.io/UniRep/app/"]
